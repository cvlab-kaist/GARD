[project.scripts]
gard = "gard:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

# gsplat's setup.py imports torch but doesn't declare it as a build dep.
[tool.uv.extra-build-dependencies]
gsplat = ["torch==2.4.1", "setuptools", "wheel", "ninja"]

[tool.uv.workspace]
members = [
    "Depth-Anything-3",
]

[tool.uv.sources]
depth-anything-3 = { workspace = true, editable = true }
gsplat = { git = "https://github.com/nerfstudio-project/gsplat.git", rev = "0b4dddf04cb687367602c01196913cde6a743d70" }
